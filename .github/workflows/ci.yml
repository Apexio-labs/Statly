name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  QT_PACKAGES: >-
    libasound2t64 libdbus-1-3 libegl1 libfontconfig1 libgbm1 libgl1 libglib2.0-0t64 libnss3
    libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0
    libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcomposite1 libxdamage1 libxkbcommon-x11-0
    libxkbfile1 libxrandr2 libxtst6

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm contract
      - name: Generated files are up to date
        run: git diff --exit-code addon/src/statly/contract
      - run: pnpm build
      - run: pnpm --filter @statly/web exec playwright install --with-deps chromium
      - name: Browser tests with simulated Anki
        run: pnpm --filter @statly/web e2e

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        anki: ["25.9.5", "26.9.3"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $QT_PACKAGES
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pyright
      - name: Tests against Anki ${{ matrix.anki }}
        run: uv run --with "anki==${{ matrix.anki }}" --with "aqt==${{ matrix.anki }}" pytest

  package:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: uv run python scripts/build_addon.py
      - uses: actions/upload-artifact@v5
        with:
          name: statly-addon
          path: dist/statly.ankiaddon

  smoke:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y xvfb dbus gnome-keyring libsecret-tools $QT_PACKAGES
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: uv sync --frozen
      - name: Run Statly inside real Anki
        run: |
          dbus-run-session -- bash -c '
            echo -n smoke | gnome-keyring-daemon --unlock --components=secrets
            xvfb-run -a uv run python scripts/smoke_anki.py'
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: --no-sandbox
          STATLY_SMOKE_KEYRING: "1"
