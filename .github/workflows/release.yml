name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: uv run python scripts/build_addon.py
      - name: Publish the add-on
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/statly.ankiaddon --title "$TAG" --notes-file CHANGELOG.md
